<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Khait">
<meta name="theme-color" content="#F3EADB">
<link rel="icon" href="../icons/icon.svg" type="image/svg+xml">
<title>Khait – Faden für Faden</title>
<link rel="stylesheet" href="khait.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="sketch" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.028" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<main id="app"></main>
<!-- Wörter, Alphabet und Zeichnungen kommen aus der bestehenden App -->
<script src="../data.js"></script>
<script src="../alphabet.js"></script>
<script src="../art.js"></script>
<script src="lessons.js"></script>
<script src="khait.js"></script>
</body>
</html>
